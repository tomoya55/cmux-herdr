[project]
name = "cmux-herdr"
version = "1.1.0"
description = "herdr plugin that propagates agent status to the cmux sidebar"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "vulture>=2.14",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.vulture]
paths = ["cmux_herdr.py", "cmux_herdr_core"]
min_confidence = 60
